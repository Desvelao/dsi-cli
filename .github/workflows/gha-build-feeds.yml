name: Build feeds file (reusable)

on:
  workflow_call:
    inputs:
      wheel_tag:
        description: Release tag for wheel download
        required: false
        type: string
        default: "v0.0.1-alpha1"
      source_dir:
        description: Source directory used by dsipy command
        required: false
        type: string
        default: "feeds"
      feeds_limit:
        description: Max number of newest items to include in the feed. Empty = unlimited.
        required: false
        type: string
      feeds_file:
        description: Output feed filename
        required: false
        type: string
        default: "feeds.rss"
      feeds_title:
        description: Feed title
        required: false
        type: string
        default: "DSI Feed"
      feeds_description:
        description: Feed description
        required: false
        type: string
        default: "DSI feed updates"
      feeds_author:
        description: Feed author
        required: false
        type: string
      feeds_email:
        description: Feed author email
        required: false
        type: string
      feed_link:
        description: Feed URL. If empty, it is generated from owner/repo + feeds_file.
        required: false
        type: string
        default: ""
      feeds_vars:
        description: Additional variables to pass to feed templates (key=value format, one per line)
        required: false
        type: string
      command_args:
        description: Additional arguments to pass to dsipy feeds build command
        required: false
        type: string
      artifact_name:
        description: Artifact name that contains the generated feed file
        required: false
        type: string
        default: "feeds-file"
    secrets:
      wheel_repo_token:
        description: Optional token with read access to wheel_repo releases
        required: false
      feeds_title:
        description: Feed title
        required: false
      feeds_description:
        description: Feed description
        required: false
      feeds_author:
        description: Feed author
        required: true
      feeds_email:
        description: Feed author email
        required: true
      feed_link:
        description: Feed URL. If empty, it is generated from owner/repo + feeds_file.
        required: false
      feeds_vars:
        description: Additional variables to pass to feed templates (key=value format, one per line)
        required: false
      sign_private_key:
        description: Private key for signing feed entries (PEM format)
        required: false
      sign_public_key:
        description: Public key for signing feed entries (PEM format)
        required: false
    outputs:
      feeds_file:
        description: Generated feed filename
        value: ${{ jobs.build.outputs.feeds_file }}
      artifact_name:
        description: Artifact name with generated feed file
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      feeds_file: ${{ steps.meta.outputs.feeds_file }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      WHEEL_REPO: Desvelao/dsipy
      WHEEL_TAG: ${{ inputs.wheel_tag }}
      WHEEL_ASSET: "*.whl"
      FEEDS_FILE: ${{ inputs.feeds_file }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Resolve output metadata
        id: meta
        run: |
          set -euo pipefail
          echo "feeds_file=${FEEDS_FILE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install wheel from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.wheel_repo_token || github.token }}
        run: |
          set -euo pipefail
          mkdir -p wheel

          tag="${WHEEL_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$WHEEL_REPO" --json tagName -q .tagName)
          fi

          gh release download "$tag" \
            --repo "$WHEEL_REPO" \
            --pattern "$WHEEL_ASSET" \
            --dir wheel

          wheel_file=$(find wheel -maxdepth 1 -type f -name '*.whl' | head -n 1)
          if [ -z "$wheel_file" ]; then
            echo "No wheel found in release $tag for $WHEEL_REPO matching $WHEEL_ASSET"
            exit 1
          fi

          python -m pip install --upgrade pip
          python -m pip install "$wheel_file"

      - name: Build feeds file
        env:
          FEEDS_AUTHOR: ${{ secrets.feeds_author || inputs.feeds_author }}
          FEEDS_EMAIL: ${{ secrets.feeds_email || inputs.feeds_email }}
          FEEDS_DESCRIPTION: ${{ secrets.feeds_description || inputs.feeds_description }}
          FEEDS_TITLE: ${{ secrets.feeds_title || inputs.feeds_title }}
          FEEDS_LINK: ${{ secrets.feed_link || inputs.feed_link }}
          FEEDS_VARS_SECRET: ${{ secrets.feeds_vars }}
          FEEDS_VARS_INPUT: ${{ inputs.feeds_vars }}
          SOURCE_DIR: ${{ inputs.source_dir }}
          FEEDS_LIMIT: ${{ inputs.feeds_limit }}
          EXTRA_COMMAND_ARGS: ${{ inputs.command_args }}
          SIGN_PRIVATE_KEY: ${{ secrets.sign_private_key }}
          SIGN_PUBLIC_KEY: ${{ secrets.sign_public_key }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Values come from secrets and inputs: they are only read from the
          # environment (never expanded into the script text) and must be single line.
          for name in FEEDS_AUTHOR FEEDS_EMAIL FEEDS_TITLE FEEDS_DESCRIPTION FEEDS_LINK; do
            case "${!name}" in
              *$'\n'*) echo "::error::$name must be a single line"; exit 1 ;;
            esac
          done

          gh_owner_lower="${GH_OWNER,,}"
          gh_repo_lower="${GH_REPO,,}"
          gh_pages_base_url="https://${gh_owner_lower}.github.io/${gh_repo_lower}"
          gh_repo_source_base_url="https://github.com/${GH_OWNER}/${GH_REPO}/tree/${GITHUB_REF_NAME}"

          link="$FEEDS_LINK"
          if [ -z "$link" ]; then
            link="${gh_pages_base_url}/${FEEDS_FILE}"
          fi

          sign_args=()
          if [ -n "$SIGN_PRIVATE_KEY" ] || [ -n "$SIGN_PUBLIC_KEY" ]; then
            if [ -z "$SIGN_PRIVATE_KEY" ] || [ -z "$SIGN_PUBLIC_KEY" ]; then
              echo "::error::sign_private_key and sign_public_key must be set together"
              exit 1
            fi
            umask 077
            printf '%s\n' "$SIGN_PRIVATE_KEY" > "$RUNNER_TEMP/sign_private.pem"
            printf '%s\n' "$SIGN_PUBLIC_KEY" > "$RUNNER_TEMP/sign_public.pem"
            sign_args=(--sign-priv "$RUNNER_TEMP/sign_private.pem" --sign-pub "$RUNNER_TEMP/sign_public.pem")
          fi

          {
            printf 'gh_owner=%s\n' "$GH_OWNER"
            printf 'gh_repo=%s\n' "$GH_REPO"
            printf 'gh_pages_base_url=%s\n' "$gh_pages_base_url"
            printf 'gh_repo_source_base_url=%s\n' "$gh_repo_source_base_url"
            printf 'author=%s\n' "$FEEDS_AUTHOR"
            printf 'email=%s\n' "$FEEDS_EMAIL"
            if [ -n "$FEEDS_VARS_SECRET" ]; then printf '%s\n' "$FEEDS_VARS_SECRET"; fi
            if [ -n "$FEEDS_VARS_INPUT" ]; then printf '%s\n' "$FEEDS_VARS_INPUT"; fi
          } > feeds.vars

          limit_args=()
          if [ -n "$FEEDS_LIMIT" ]; then
            limit_args=(--limit "$FEEDS_LIMIT")
          fi

          echo "Building ${FEEDS_FILE}"
          # EXTRA_COMMAND_ARGS is intentionally split into words
          # shellcheck disable=SC2086
          dsipy feeds build "$SOURCE_DIR" \
            --title "$FEEDS_TITLE" \
            --link "$link" \
            --description "$FEEDS_DESCRIPTION" \
            --author "$FEEDS_AUTHOR" \
            --email "$FEEDS_EMAIL" \
            --output "$FEEDS_FILE" \
            "${limit_args[@]}" \
            --var-file feeds.vars \
            "${sign_args[@]}" \
            $EXTRA_COMMAND_ARGS

          rm -f "$RUNNER_TEMP/sign_private.pem" "$RUNNER_TEMP/sign_public.pem"

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p out

          cp "$FEEDS_FILE" "out/$FEEDS_FILE"

      - name: Upload generated feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/${{ env.FEEDS_FILE }}
          if-no-files-found: error
          retention-days: 1
